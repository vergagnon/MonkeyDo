# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "NoCap Deposits"
client_id = "fd539a95a41afab22069e73ff8bb0745"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Automated balance capture will additionally need the protected scopes
# read_customer_payment_methods + write_payment_mandate (requires Shopify
# approval — request via the Partner dashboard once the app record exists).
scopes = "write_products,read_orders,read_purchase_options,write_purchase_options"
optional_scopes = [ ]
use_legacy_install_flow = false

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # TEMPORARILY DISABLED — orders/create carries protected customer data, and
  # deploys fail until the app is granted access: Dev Dashboard → NoCap
  # Deposits → API access → "Protected customer data access" → request
  # "App functionality". Uncomment and re-deploy once granted.
  # Handled by: /app/routes/webhooks.orders.create.tsx
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/orders/create"
  # topics = [ "orders/create" ]

[auth]
redirect_urls = [
  "https://example.com/auth/callback",
  "https://example.com/auth/shopify/callback",
  "https://example.com/api/auth/callback"
]
